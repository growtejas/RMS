global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "rms-next-web"
    metrics_path: /api/metrics
    scheme: http
    bearer_token: change-me-local-token
    static_configs:
      - targets:
          - 192.168.1.164:3003
